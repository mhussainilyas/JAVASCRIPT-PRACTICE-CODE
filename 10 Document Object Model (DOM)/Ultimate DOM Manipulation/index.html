<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOM - Document Object Model</title>
    <link rel="stylesheet" href="style.css" />
    <script defer src="event-handling.js"></script>
  </head>
  <body>
    <h1 class="main-heading">Muhammad Hussain</h1>
    <p id="paragraph">This is some paragraph content.</p>
    <button class="btn">Click Me</button>

    <div class="parent-div">
      <p class="para-1">This is para 01</p>
      <p class="para-2">This is para 02</p>
      <p class="para-3">This is para 03</p>
    </div>

    <h2 class="heading-2">Learning never ends.</h2>
    <p class="paragraph-lorem">
      Lorem ipsum dolor sit amet consectetur, adipisicing elit. Iste consectetur
      expedita <b>soluta dolorum</b> alias magni consequatur rerum possimus
      <i>accusantium</i>
      id?
    </p>

    <h3 class="css-manipulation-heading">This is h3 heading</h3>

    <button
      class="click-btn"
      onclick="console.log('Button is clicked!')"
      ondblclick="console.log('Double clicked the button')"
      oncontextmenu="console.log('context menu open')"
    >
      button click
    </button>
  </body>
</html>
